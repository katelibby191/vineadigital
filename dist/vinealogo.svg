<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="2400" height="1800" role="img" aria-label="Vinea Digital logo mark" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="leftArm" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="0.6" stop-color="#7357FF"/>
      <stop offset="1" stop-color="#4F7CFF"/>
    </linearGradient>
    <linearGradient id="rightArm" x1="1" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#3FD2FF"/>
      <stop offset="1" stop-color="#4F7CFF"/>
    </linearGradient>
    <linearGradient id="tip" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#4F8CFF"/>
      <stop offset="1" stop-color="#5AB4FF"/>
    </linearGradient>
  </defs>
  <g transform="translate(-1165,-155)">
    <!-- Right arm, cut by the left arm -->
    <polygon points="1330,162 1395,162 1327,262 1294,218" fill="url(#rightArm)"/>
    <!-- Left arm in front -->
    <polygon points="1172,162 1252,162 1324.4,264.6 1252,275" fill="url(#leftArm)"/>
    <!-- Lower tip, separated by the cut -->
    <polygon points="1258,284 1319,274 1285,322" fill="url(#tip)"/>
  </g>
</svg>
